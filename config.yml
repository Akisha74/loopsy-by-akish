# ==========================================================
# Настройки админ-панели Loopsy by Akish (Sveltia CMS)
# ВАЖНО: перед публикацией замените repo ниже на свой,
# в формате ИмяПользователя/НазваниеРепозитория на GitHub.
# ==========================================================

backend:
  name: github
  repo: ВАШ-GITHUB-ЛОГИН/loopsy-by-akish
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: ru

collections:
  - name: "products"
    label: "Товары"
    icon: "shopping_bag"
    files:
      - name: "products"
        label: "Список товаров"
        file: "content/products.json"
        fields:
          - label: "Товары"
            name: "items"
            widget: "list"
            label_singular: "Товар"
            summary: "{{fields.name}} — {{fields.price}} ₽"
            fields:
              - { label: "Название", name: "name", widget: "string", hint: "Например: Домик-ракушка «Уют»" }
              - label: "Категория"
                name: "category"
                widget: "select"
                options:
                  - { label: "Вязаные домики", value: "yarn-houses" }
                  - { label: "Именные миски", value: "named-bowls" }
                  - { label: "Шлейки", value: "harnesses" }
                  - { label: "Контейнеры для влажного корма", value: "food-containers" }
                  - { label: "Контейнеры для пакетиков", value: "bag-holders" }
              - { label: "Цена, ₽", name: "price", widget: "number", value_type: "int", min: 0 }
              - { label: "Приставка к цене (необязательно)", name: "price_note", widget: "string", required: false, hint: "Например: «от»" }
              - { label: "Показывать на главной странице", name: "featured", widget: "boolean", default: false }
              - { label: "Короткое описание (для карточки)", name: "short_description", widget: "string" }
              - { label: "Полное описание", name: "description", widget: "text" }
              - { label: "Что можно выбрать (размер/цвет и т.д.)", name: "options", widget: "string", required: false }
              - { label: "Изготовление под заказ", name: "made_to_order", widget: "boolean", default: true }
              - label: "Фотографии"
                name: "images"
                widget: "list"
                required: false
                field: { label: "Фото", name: "image", widget: "image" }

  - name: "reviews"
    label: "Отзывы"
    icon: "reviews"
    files:
      - name: "reviews"
        label: "Список отзывов"
        file: "content/reviews.json"
        fields:
          - label: "Отзывы"
            name: "items"
            widget: "list"
            label_singular: "Отзыв"
            summary: "{{fields.author}} — {{fields.pet}}"
            fields:
              - { label: "Имя автора", name: "author", widget: "string" }
              - { label: "Питомец (кличка и вид)", name: "pet", widget: "string", hint: "Например: кот Барсик" }
              - label: "Оценка"
                name: "rating"
                widget: "select"
                options: [1, 2, 3, 4, 5]
                default: 5
              - { label: "Текст отзыва", name: "text", widget: "text" }
              - { label: "Фото (необязательно)", name: "photo", widget: "image", required: false }

  - name: "settings"
    label: "Тексты и контакты"
    icon: "settings"
    files:
      - name: "general"
        label: "Основные тексты сайта"
        file: "content/site.json"
        fields:
          - { label: "Название бренда", name: "brand_name", widget: "string" }
          - { label: "Слоган", name: "tagline", widget: "string" }
          - { label: "Заголовок на главной странице", name: "hero_title", widget: "string" }
          - { label: "Подзаголовок на главной странице", name: "hero_subtitle", widget: "text" }
          - { label: "Текст кнопки на главной", name: "hero_cta", widget: "string" }
          - { label: "Краткий текст «О нас» (на главной)", name: "about_short", widget: "text" }
          - { label: "Заголовок страницы «О нас»", name: "about_title", widget: "string" }
          - label: "Текст «О нас» (абзацы)"
            name: "about_text"
            widget: "list"
            hint: "Каждый абзац — отдельная строка"
          - { label: "Заголовок «Как сделать заказ»", name: "how_it_works_title", widget: "string" }
          - label: "Шаги заказа"
            name: "how_it_works"
            widget: "list"
            hint: "Каждый шаг — отдельная строка"
          - label: "Контакты"
            name: "contacts"
            widget: "object"
            fields:
              - { label: "Город", name: "city", widget: "string" }
              - { label: "Телефон", name: "phone", widget: "string" }
              - { label: "WhatsApp (только цифры, с кодом страны)", name: "whatsapp", widget: "string", hint: "Например: 79991234567, без плюса и пробелов" }
              - { label: "Telegram (без @)", name: "telegram", widget: "string" }
              - { label: "Instagram (без @)", name: "instagram", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Часы работы / когда отвечаете", name: "work_hours", widget: "string" }
          - { label: "Текст в подвале сайта", name: "footer_note", widget: "string" }
